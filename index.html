<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Brote</title>
  <meta name="description" content="Seguimiento de las plantas de tu casa: riego, abono, fotos y comparación.">
  <meta name="theme-color" content="#F4F1E8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14201A" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Brote">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" aria-live="polite"></div>

  <div id="sheet-backdrop" class="sheet-backdrop" hidden></div>
  <div id="sheet" class="sheet" role="dialog" aria-modal="true" hidden></div>

  <div id="toast" class="toast" role="status" hidden></div>
  <div id="update-bar" class="update-bar" hidden>
    <span>Hay una versión nueva de Brote.</span>
    <button type="button" id="update-btn">Actualizar</button>
  </div>

  <noscript>Brote necesita JavaScript activado para funcionar.</noscript>
  <script src="app.js"></script>
</body>
</html>
